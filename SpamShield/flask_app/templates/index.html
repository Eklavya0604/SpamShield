<!DOCTYPE html>
<html>
<head>
    <title>Email Spam Message Classification Using Python & Machine Learning</title>
    <link rel="stylesheet" href="/loginsignup/public/login.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    

</head>
    <style>
        /* Basic Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}
header {
    background: #011535;
    padding: 1rem 0.5rem;
    position: fixed;
    width: 100%;
    z-index: 1000;
    top:0;

}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 1rem;
    color: #fff;
    font-weight: 700;
}

.nav-links {
    list-style: none;
    display: flex;
}

.nav-links li {
    margin-left: 1.5rem;
}

.nav-links a {
    color: #fff;
    text-decoration: none;
    font-size: 1rem;
    transition: color 0.3s ease;
}

.nav-links a:hover {
    color: #00c6ff;
}

.login-btn {
    background-color: #00c6ff;
    padding: 0.6rem 1.2rem;
    border-radius: 20px;
    color: #011535;
    font-weight: 600;
    transition: background 0.3s ease;
}

.login-btn:hover {
    background-color: #0072ff;
}

/* Body Styling */
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0072ff, #00c6ff);
}

        .container {
            margin-top: 50px;
        }

        h1 {
            color: #000000; /* Set your desired heading color */
        }

        .form-control {
            background-color: #ffffff; /* Set your desired textarea background color */
        }

        .btn-primary {
            background-color: #007bff; /* Set your desired button background color */
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0069d9; /* Set your desired button hover background color */
            border-color: #0062cc;
        }

        .alert-success {
            background-color: #d4edda; /* Set your desired success alert background color */
            color: #155724; /* Set your desired success alert text color */
            border-color: #c3e6cb;
        }

        .alert-danger {
            background-color: #f8d7da; /* Set your desired danger alert background color */
            color: #721c24; /* Set your desired danger alert text color */
            border-color: #f5c6cb;
        }
    </style>

<body>
    <header>
        <nav>
          <div class="logo">SpamShield</div>
          <ul class="nav-links">
            <li><a href="mail.html">Home</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="http://127.0.0.1:5000/idea">Email checker</a></li>


            <li><a href="mail.html" class="login-btn">Logout</a></li>
          </ul>
        </nav>
      </header>
    <div class="container mt-5">
        <h1 class="mb-4">Email Spam Message Classifier</h1>
        <form method="POST" action="{{ url_for('analyze_mail') }}">
            <div class="form-group">
                <label for="mail">Enter your mail context:</label>
                <textarea class="form-control" id="mail" name="mail" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Analyze</button>
        </form>

        {% if classify is defined %}
            <div class="mt-4">
                {% if classify == 0 %}
                    <div class="alert alert-danger" role="alert">This is a spam mail</div>
                {% elif classify == 1 %}
                    <div class="alert alert-success" role="alert">This is a Valid mail</div>
                {% endif %}
            </div>
        {% endif %}
    </div>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
